<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen Learn — Learn anything. Understand everything.</title>
  <meta name="description" content="A free learning library for school students. Computer Science, Mathematics, Biology, Physics, Chemistry, English, History, Geography, Economics, Business and Languages — aligned with British, Cambridge, American and IB curricula.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="logo" aria-label="Lumen Learn home">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-text">Lumen&nbsp;Learn</span>
      </a>
      <nav class="main-nav" aria-label="Primary">
        <a href="#/subjects" data-nav>Explore</a>
        <a href="#/subjects" data-nav>Subjects</a>
        <a href="#/curriculums" data-nav>Curriculums</a>
        <a href="#/paths" data-nav>Learning Paths</a>
        <a href="#/search" data-nav>Search</a>
      </nav>
      <div class="header-actions">
        <a href="#/subjects" class="btn btn-ghost">Log in</a>
        <a href="#/subjects" class="btn btn-primary">Start learning</a>
      </div>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="app" aria-live="polite">
    <noscript>
      <div class="container section">
        <h1>JavaScript is required</h1>
        <p>Lumen Learn is an interactive learning site and needs JavaScript to render lessons.</p>
      </div>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-text">Lumen&nbsp;Learn</span>
        <p class="footer-note">A free, open learning library for school students — built to teach, not to sell.</p>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <a href="#/subjects">Subjects</a>
        <a href="#/curriculums">Curriculums</a>
        <a href="#/paths">Learning Paths</a>
        <a href="#/search">Search</a>
      </nav>
    </div>
    <div class="container footer-bottom">
      <p>Content is written for learners and shared freely for education.</p>
    </div>
  </footer>

  <!-- Pyodide (Python in the browser) loads lazily only on lessons with runnable code -->
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
